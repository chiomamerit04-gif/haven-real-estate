<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/property-details.css">
    <title>PROPERTY DDETAILS | HAVEN</title>
</head>
<body>
    <div id="header"></div>
    <main>
    <section class="property-details-hero">
        <div class="property-details-image">
            <img id="property-image" src="" alt="">
        </div>
    </section>
    <section class="property-details-section">
        <div class="property-details-content">
            <div class="property-details-main">
                <p id="property-location" class="property-location"></p>
                <h1 id="property-name"></h1>
                <p id="property-price" class="property-details-price"></p>
                <div class="property-details-list">
                    <span id="property-beds"></span>
                    <span id="property-baths"></span>
                    <span id="property-size"></span>
                </div>
                <div class="property-description">
                    <p class="details-label">PROPERTY DESCRIPTION</p>
                    <h2 id="property-description-title"></h2>
                    <p id="property-description-one"></p>
                    <p id="property-description-two"></p>
                </div>
                <div class="property-features">
                    <p class="details-label">PROPERTY FEATURES</p>
                    <h2>What's Included</h2>
                    <div id="property-features" class="features-grid"></div>
                </div>
            </div>
            <aside class="property-agent-card">
                <p class="details-label">PROPERTY AGENT</p>
                <h2 id="agent-name"></h2>
                <p id="agent-role"></p>
                <a href="contact.html" class="details-btn">Contact Agent</a>
                <a href="contact.html" class="details-btn secondary-btn">Schedule a Viewing</a>
            </aside>
        </div>
    </section>
</main>
<button class="scroll-top">↑</button>
<div id="footer"></div>
<script src="js/script.js"></script>
<script src="js/properties-data.js"></script>
<script src="js/property-details.js"></script>
</body>
</html>
